spring:
  datasource:
    url: jdbc:h2:mem:mydb
    username: sa
    password: password
    driverClassName: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true

server:
  port: 443
  ssl:
    enabled: true
    key-store: keystore.p12
    key-store-password: password
    keyStoreType: PKCS12
    keyAlias: tomcat


error2:
  empIdRegEx: Employeee ID should not be empty rather it should be in number type
  empNameRegEx: Employee Name should not be empty rather should be in String type
  compRegEx: Company Name should not be empty rather should be in String type
  salaryRegEx: Salary should not be empty rather should be in number

